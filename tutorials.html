<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户教程 — KnotLink</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-hero { padding: 120px 0 60px; text-align: center; }
        .page-hero h1 { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
        .page-hero p { color: var(--color-text-dim); font-size: 1.1rem; max-width: 560px; margin: 0 auto; }

        .tutorial-filters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
        .tutorial-filters button { padding: 8px 20px; border-radius: 99px; border: 1px solid var(--color-border); background: transparent; color: var(--color-text-dim); cursor: pointer; font-size: 0.88rem; transition: all .2s; }
        .tutorial-filters button.active, .tutorial-filters button:hover { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }

        .tutorial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 64px; }
        .tutorial-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 28px; transition: all .3s; cursor: pointer; }
        .tutorial-card:hover { border-color: rgba(229, 165, 10,.4); background: var(--color-bg-card-hover); transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.25); }
        .tutorial-card .tut-level { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; margin-bottom: 14px; }
        .tut-beginner { background: rgba(52,211,153,.15); color: var(--color-green); }
        .tut-intermediate { background: rgba(251,146,60,.15); color: var(--color-orange); }
        .tut-advanced { background: rgba(244,114,182,.15); color: var(--color-pink); }
        .tutorial-card h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
        .tutorial-card p { color: var(--color-text-dim); font-size: 0.88rem; line-height: 1.7; margin-bottom: 14px; }
        .tutorial-card .tut-meta { display: flex; gap: 16px; font-size: 0.78rem; color: var(--color-text-muted); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container nav-inner">
        <a href="index.html" class="nav-brand">
            <img src="logo.png" alt="KnotLink" class="nav-logo-small">
            <span>KnotLink</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="nodes.html">节点</a></li>
            <li><a href="recipes.html">配方</a></li>
            <li><a href="scenarios.html">场景</a></li>
            <li><a href="tutorials.html" class="btn-nav">快速开始</a></li>
        </ul>
    </div>
</nav>

<section class="page-hero">
    <div class="container">
        <h1>📖 用户教程</h1>
        <p>从零开始学习 KnotLink，无论你是用户还是开发者，都能快速上手。</p>
    </div>
</section>

<section class="section" style="padding-top:0">
    <div class="container">

        <div class="tutorial-filters">
            <button class="active" data-filter="all">全部教程</button>
            <button data-filter="beginner">🟢 入门</button>
            <button data-filter="intermediate">🟠 进阶</button>
            <button data-filter="advanced">🔴 高级</button>
        </div>

        <div class="tutorial-grid" id="tutorialGrid">
            <!-- JS 动态生成 -->
        </div>
    </div>
</section>

<section class="section cta-section" style="padding-top:0">
    <div class="container">
        <div class="cta-box">
            <h2>找不到你需要的教程？</h2>
            <p>加入社区，告诉我们你还想学习什么。</p>
            <div class="cta-actions">
                <a href="#" class="btn btn-primary btn-lg">提交教程请求</a>
                <a href="#" class="btn btn-outline btn-lg">加入社区</a>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container footer-grid">
        <div class="footer-brand">
            <img src="logo.png" alt="KnotLink" class="footer-logo">
            <p>KnotLink — 本地应用协作通信协议</p>
        </div>
        <div class="footer-links">
            <h4>产品</h4>
            <a href="nodes.html">节点索引</a>
            <a href="recipes.html">配方中心</a>
            <a href="scenarios.html">典型场景</a>
        </div>
        <div class="footer-links">
            <h4>开发者</h4>
            <a href="#">文档</a>
            <a href="#">SDK</a>
            <a href="#">API 参考</a>
        </div>
        <div class="footer-links">
            <h4>关于</h4>
            <a href="compare.html">方案对比</a>
            <a href="#">GitHub</a>
            <a href="#">社区</a>
        </div>
    </div>
    <div class="container footer-bottom">
        <p>&copy; 2025 KnotLink. All rights reserved.</p>
    </div>
</footer>

<script>
const TUTORIALS = [
    { title: '五分钟快速接入 KnotLink', desc: '从下载 SDK 到发出第一个跨应用调用，最快只需五分钟。', level: 'beginner', time: '5 分钟', type: '文字 + 代码' },
    { title: '配置你的第一个协作配方', desc: '通过配方编辑器，拖拽式配置应用间调用流程，无需写代码。', level: 'beginner', time: '10 分钟', type: '图文教程' },
    { title: '安装与配置 Node SDK', desc: '为你的 Python / Go / Node.js 应用安装 SDK 并进行基础配置。', level: 'beginner', time: '8 分钟', type: '文字 + 代码' },
    { title: '理解 KnotLink 协议格式', desc: '深入了解 KnotLink 统一调用格式的结构与设计理念。', level: 'beginner', time: '15 分钟', type: '文档' },
    { title: '用配方连接两个本地应用', desc: '实战：将 VS Code 与终端通过配方连接，实现代码编辑自动触发命令执行。', level: 'intermediate', time: '20 分钟', type: '视频 + 代码' },
    { title: '跨语言 RPC 调用实战', desc: 'Python 调用 Rust 函数，Node.js 调用 Go 服务——手把手教学。', level: 'intermediate', time: '25 分钟', type: '视频 + 代码' },
    { title: '构建数据 ETL 管道', desc: 'Excel → Python 清洗 → R 分析 → 可视化工具，全自动流转。', level: 'intermediate', time: '30 分钟', type: '图文教程' },
    { title: '自定义节点开发指南', desc: '为不支持的语言或应用开发自定义 KnotLink 节点。', level: 'advanced', time: '40 分钟', type: '文档 + 代码' },
    { title: 'KnotLink 协议深度解析', desc: '协议设计原理、消息路由机制、安全模型全面剖析。', level: 'advanced', time: '45 分钟', type: '文档' },
    { title: '性能优化与调优', desc: '高并发场景下的 KnotLink 性能优化策略与最佳实践。', level: 'advanced', time: '35 分钟', type: '文字 + 代码' },
    { title: '编写复杂配方：条件分支与循环', desc: '在配方中使用条件判断、循环和变量，实现复杂业务逻辑。', level: 'advanced', time: '50 分钟', type: '视频 + 代码' },
    { title: 'KnotLink 安全最佳实践', desc: '权限控制、传输加密、审计日志——生产环境安全配置指南。', level: 'advanced', time: '30 分钟', type: '文档' },
];

function renderTutorials(filter = 'all') {
    const grid = document.getElementById('tutorialGrid');
    const items = filter === 'all' ? TUTORIALS : TUTORIALS.filter(t => t.level === filter);
    grid.innerHTML = items.map(t => `
        <div class="tutorial-card">
            <span class="tut-level ${t.level === 'beginner' ? 'tut-beginner' : t.level === 'intermediate' ? 'tut-intermediate' : 'tut-advanced'}">
                ${t.level === 'beginner' ? '🟢 入门' : t.level === 'intermediate' ? '🟠 进阶' : '🔴 高级'}
            </span>
            <h3>${t.title}</h3>
            <p>${t.desc}</p>
            <div class="tut-meta">
                <span>⏱ ${t.time}</span>
                <span>📄 ${t.type}</span>
            </div>
        </div>
    `).join('');
}

document.querySelectorAll('.tutorial-filters button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tutorial-filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTutorials(btn.dataset.filter);
    });
});

renderTutorials();
</script>
</body>
</html>
