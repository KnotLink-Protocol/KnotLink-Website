<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">
    <style>
        .page-hero { padding: 120px 0 60px; text-align: center; }
        .page-hero h1 { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
        .page-hero p { color: var(--color-text-dim); font-size: 1.1rem; max-width: 560px; margin: 0 auto; }

        .recipe-toolbar { display: flex; gap: 14px; margin-bottom: 36px; flex-wrap: wrap; align-items: center; }
        .recipe-search { flex: 1; min-width: 240px; }
        .recipe-search input { width: 100%; padding: 12px 18px; border-radius: 99px; border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text); font-size: 0.94rem; outline: none; transition: border-color .2s; }
        .recipe-search input:focus { border-color: var(--color-accent); }
        .recipe-search input::placeholder { color: var(--color-text-muted); }
        .recipe-tags-filter { display: flex; gap: 8px; flex-wrap: wrap; }
        .recipe-tags-filter button { padding: 6px 16px; border-radius: 99px; border: 1px solid var(--color-border); background: transparent; color: var(--color-text-dim); cursor: pointer; font-size: 0.82rem; transition: all .2s; }
        .recipe-tags-filter button.active, .recipe-tags-filter button:hover { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
        .recipe-app-filter select { padding: 12px 18px; border-radius: 99px; border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text); font-size: 0.88rem; outline: none; cursor: pointer; transition: border-color .2s; min-width: 180px; }
        .recipe-app-filter select:focus { border-color: var(--color-accent); }
        .recipe-app-filter select option { background: var(--color-bg-card); color: var(--color-text); }

        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-bottom: 64px; }

        .recipe-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 24px; transition: all .3s; cursor: pointer; }
        .recipe-card:hover { border-color: rgba(229, 165, 10,.4); background: var(--color-bg-card-hover); transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.25); }
        .recipe-card .rc-icon { font-size: 2rem; margin-bottom: 12px; }
        .recipe-card .rc-name { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
        .recipe-card .rc-desc { font-size: 0.82rem; color: var(--color-text-dim); line-height: 1.6; margin-bottom: 12px; }
        .recipe-card .rc-footer { display: flex; justify-content: space-between; align-items: center; }
        .recipe-card .rc-tags { display: flex; gap: 5px; flex-wrap: wrap; }
        .recipe-card .rc-tags span { padding: 2px 8px; border-radius: 99px; font-size: 0.68rem; font-weight: 600; background: rgba(229, 165, 10,.1); color: var(--color-accent); }
        .recipe-card .rc-uses { font-size: 0.72rem; color: var(--color-text-muted); }
    </style>
</head>
<body>

            <li><a href="index.html">首页</a></li>

            <li><a href="tutorials.html" class="btn-nav">快速开始</a></li>

        <h1>🧪 配方中心</h1>

    </div>
</section>

<section class="section" style="padding-top:0">
    <div class="container">

        <div class="recipe-toolbar">
            <div class="recipe-search">
                <input type="text" id="recipeSearch" placeholder="搜索配方（如 AI、Python、数据）...">
            </div>
            <div class="recipe-app-filter">
                <select id="appFilter">
                    <option value="all">📱 全部应用</option>

                </select>

        <div class="recipe-tags-filter" id="tagFilters">
            <button class="active" data-tag="all">全部</button>
            <!-- JS 动态生成 -->

    </div>
</section>

            <h2>有好的配方想法？</h2>

            <div class="cta-actions">
                <a href="#" class="btn btn-primary btn-lg">提交配方</a>

<footer class="footer">
    <div class="container footer-grid">
        <div class="footer-brand">
            <img src="logo.png" alt="KnotLink" class="footer-logo">

<script src="recipes-data.js"></script>
<script>
// =============================================
// Recipe data — from recipes-data.js
// =============================================
function getRecipes() {
    return window.__KNOTLINK_RECIPES__ || [];
}
function getTags() {
    return window.__KNOTLINK_RECIPE_TAGS__ || [];
}
function getApps() {
    return window.__KNOTLINK_RECIPE_APPS__ || [];
}

let activeTag = 'all';
let activeApp = 'all';

// =============================================
// Render tag filter buttons
// =============================================
function renderTagFilters() {
    const container = document.getElementById('tagFilters');
    const allTags = getTags();

    container.innerHTML = '<button class="active" data-tag="all">全部</button>' +
        allTags.map(t => `<button data-tag="${t}">${t}</button>`).join('');

    container.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
            container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeTag = btn.dataset.tag;
            filterRecipes();
        });
    });
}

// =============================================
// Render app filter dropdown
// =============================================
function renderAppFilter() {
    const select = document.getElementById('appFilter');
    const allApps = getApps();

    // Build a unique app_id → app_name map from recipe links
    const appMap = {};
    const recipes = getRecipes();
    for (const r of recipes) {
        for (const link of r.links) {
            if (!appMap[link.app_id]) {
                appMap[link.app_id] = link.app_name || link.app_id;
            }
        }
    }

    for (const [appId, appName] of Object.entries(appMap).sort((a, b) => a[1].localeCompare(b[1]))) {
        const option = document.createElement('option');
        option.value = appId;
        option.textContent = `${appName}`;
        select.appendChild(option);
    }

    select.addEventListener('change', () => {
        activeApp = select.value;
        filterRecipes();
    });
}

// =============================================
// Filter and render recipe grid
// =============================================
function filterRecipes() {
    const search = document.getElementById('recipeSearch').value.toLowerCase();
    const recipes = getRecipes();

    const filtered = recipes.filter(r => {
        // Search filter
        const matchSearch = !search
            || r.name.toLowerCase().includes(search)
            || r.description.toLowerCase().includes(search)
            || r.tags.some(t => t.toLowerCase().includes(search));

        // Tag filter
        const matchTag = activeTag === 'all' || r.tags.includes(activeTag);

        // App filter
        const matchApp = activeApp === 'all' || r.links.some(l => l.app_id === activeApp);

        return matchSearch && matchTag && matchApp;
    });

    const grid = document.getElementById('recipeGrid');

    if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--color-text-muted)">
            <div style="font-size:3rem;margin-bottom:12px">📭</div>
            <p>没有匹配的配方</p>
            <p style="font-size:0.85rem;margin-top:6px">试试更换筛选条件，或<a href="https://github.com/KnotLink-Protocol/KNodeIndex" style="color:var(--color-accent)">提交新配方</a></p>
        </div>`;
        return;
    }

    grid.innerHTML = filtered.map(r => `
        <a href="recipe-detail.html?id=${encodeURIComponent(r.id)}" class="recipe-card" style="display:block">
            <div class="rc-icon">${r.icon}</div>
            <div class="rc-name">${r.name}</div>
            <div class="rc-desc">${r.description}</div>
            <div class="rc-footer">
                <div class="rc-tags">${r.tags.map(t => `<span>${t}</span>`).join('')}</div>
                <span class="rc-uses" style="font-size:0.72rem;color:var(--color-text-muted)">v${r.version}</span>
            </div>
        </a>
    `).join('');
}

// =============================================
// Init
// =============================================
document.getElementById('recipeSearch').addEventListener('input', filterRecipes);
renderTagFilters();
renderAppFilter();
filterRecipes();
</script>
</body>
</html>
